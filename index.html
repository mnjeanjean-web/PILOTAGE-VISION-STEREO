function defaults(){return {schema:1,config:{low:120000,target:130000,high:140000,year:2027,hours:39,weeks:46,share:50,daysMode:'À préciser',cashMartin:null,cashTheo:null,reserveGoal:null,weights:[4,4,5,10,11,11,10,5,11,12,12,5],offers:[...OFFERS],blocks:['trajectory','portfolio','development','missions'],hidden:[]},plan:{shortCount:18,shortBudget:6000,shortDays:8.5,majorCount:1,majorBudget:22000,annualEnabled:false,annualMonthly:3000,annualMonths:12},expenses:[{id:uid(),name:'Bureau — poste Martin',amount:3600,period:'Annuel',active:true},{id:uid(),name:'Bureau — second poste',amount:3600,period:'Annuel',active:false},{id:uid(),name:'Drive, messagerie et services',amount:300,period:'À préciser',active:true},{id:uid(),name:'Logiciels',amount:400,period:'À préciser',active:true}],clients:['Saguez & Partners','WeLoveArt','Double Dragon','Parti Pris','Idéactif','ANY','Black Lemon','WAY'].map((name,i)=>({id:uid(),name,type:'Agence',status:i<6?'Client actif':'En retrait',role:'Client',priority:i<6?'À entretenir':'En retrait',owner:'À définir',contact:'',email:'',offer:i===0?OFFERS[1]:i===4?OFFERS[0]:'À définir',next:'',date:'',notes:'',potential:null})),missions:[],actions:[{id:uid(),title:'Définir l’accompagnement et son périmètre',detail:'Choisir un problème récurrent à résoudre : cohérence de marque, temps forts, outils digitaux ou activations.',owner:'Martin & Théo',date:'',done:false},{id:uid(),title:'Sélectionner 12 marques pertinentes',detail:'Évaluer l’affinité créative, les besoins récurrents, l’accès au décideur et la possibilité de budget. Objectif de travail proposé.',owner:'Martin & Théo',date:'',done:false},{id:uid(),title:'Identifier un accès pour les 5 premières',detail:'Chercher des introductions auprès des clients, DC, producteurs et indépendants de votre réseau, dans le respect des relations existantes.',owner:'Martin & Théo',date:'',done:false},{id:uid(),title:'Préparer 3 preuves et une page d’offre',detail:'Montrer un enjeu, votre rôle, le système cr let state=defaults(),page=location.hash.slice(1)||'pilotage',period='Année',periodIndex=0,search='',filter='Tous',sort='Priorité';

function valid(s){
  if(!s||s.schema!==1||!s.config||!s.plan||!['clients','missions','expenses','actions'].every(k=>Array.isArray(s[k])&&s[k].length<10000))return false;
  const c=s.config,p=s.plan,nonneg=x=>Number.isFinite(x)&&x>=0,nullable=x=>x===null||nonneg(x),blocks=['trajectory','portfolio','development','missions'];
  return ['low','target','high','hours','weeks','share','year'].every(k=>nonneg(c[k]))&&c.low<=c.target&&c.target<=c.high&&c.share<=100&&c.weeks<=52&&c.hours<=168&&['cashMartin','cashTheo','reserveGoal'].every(k=>nullable(c[k]))
    &&Array.isArray(c.weights)&&c.weights.length===12&&c.weights.every(nonneg)&&c.weights.reduce((a,b)=>a+b,0)>0
    &&Array.isArray(c.offers)&&c.offers.length>0&&c.offers.every(x=>typeof x==='string')&&Array.isArray(c.blocks)&&c.blocks.length===4&&new Set(c.blocks).size===4&&c.blocks.every(x=>blocks.includes(x))&&Array.isArray(c.hidden)&&c.hidden.every(x=>blocks.includes(x))
    &&['shortCount','shortBudget','shortDays','majorCount','majorBudget','annualMonthly','annualMonths'].every(k=>nonneg(p[k]))&&['shortCount','majorCount','annualMonths'].every(k=>Number.isInteger(p[k]))&&p.annualMonths<=12&&typeof p.annualEnabled==='boolean'
    &&s.clients.every(x=>typeof x.name==='string'&&typeof x.id==='string')&&s.actions.every(x=>typeof x.title==='string'&&typeof x.id==='string'&&typeof x.done==='boolean')
    &&s.expenses.every(x=>typeof x.name==='string'&&typeof x.id==='string'&&nonneg(x.amount)&&['Mensuel','Annuel','À préciser'].includes(x.period)&&typeof x.active==='boolean')
    &&s.missions.every(m=>typeof m.id==='string'&&typeof m.name==='string'&&['budget','invoiced','collected','share','costs'].every(k=>nonneg(m[k]))&&m.collected<=m.invoiced&&m.invoiced<=m.budget&&m.share<=100&&nullable(m.daysMartin)&&nullable(m.daysTheo)&&(m.year===undefined||[2026,2027].includes(m.year))&&typeof m.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(m.date));
}

const $=s=>document.querySelector(s),e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(v),money=v=>v===null||v===undefined?'À renseigner':num(v)+' €',fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('fr-FR'):'Sans date',sum=(a,key)=>a.reduce((t,x)=>t+(Number(x[key])||0),0);

function weight(){const w=state.config.weights,total=w.reduce((a,b)=>a+b,0);return period==='Année'?1:period==='Trimestre'?w.slice(periodIndex*3,periodIndex*3+3).reduce((a,b)=>a+b,0)/total:w[periodIndex]/total}
function selectedMissions(){return state.missions.filter(m=>{const d=new Date(m.date+'T12:00:00');return missionYear(m)===state.config.year&&(period==='Année'||(period==='Trimestre'?Math.floor(d.getMonth()/3)===periodIndex:d.getMonth()===periodIndex))})}

function modal(title,html,onSubmit){$('#dialog-title').textContent=title;$('#fields').innerHTML=html;$('#form').onsubmit=ev=>{ev.preventDefault();if(onSubmit(Object.fromEntries(new FormData(ev.target)))===false)return;$('#dialog').close();save();render()};$('#dialog').showModal();}

function editClient(id){const c=state.clients.find(x=>x.id===id)||{id:uid(),name:'',type:'Marque',status:'Cible à contacter',role:'Client',priority:'À développer',owner:'Martin & Théo',offer:'À définir'};modal(id?'Modifier la relation':'Ajouter une relation',`<p class="form-help">Une structure peut être cliente, prescriptrice ou partenaire. Les montants réels proviennent des missions renseignées.</p><div class="field-grid">${formField('name','Structure / indépendant',c.name)}${formField('type','Type',c.type,'select',TYPES)}${formField('status','État de la relation',c.status,'select',STATUSES)}${formField('role','Rôle dans le réseau',c.role,'select',ROLES)}${formField('priority','Priorité',c.priority,'select',['Prioritaire','À développer','À entretenir','En retrait'])}${formField('owner','Responsable',c.owner,'select',['À définir','Martin','Théo','Martin & Théo'])}${formField('contact','Interlocuteur et fonction',c.contact)}${formField('email','Email',c.email,'email')}${formField('offer','Offre pertinente',c.offer,'select',['À définir',...state.config.offers])}${formField('potential','Potentiel annuel estimé HT',c.potential,'number',[],'Hypothèse seulement ; exclue du CA signé.')}${formField('next','Prochaine action',c.next)}${formField('date','Date de la prochaine action',c.date,'date')}${formField('notes','Contexte, besoins et introductions possibles',c.notes,'textarea',[],'','wide')}</div>${id?'<button class="danger" type="button" id="remove">Supprimer la relation</button>':''}`,f=>{if(!f.name.trim())return false;Object.assign(c,f,{potential:f.potential===''?null:Number(f.potential)});if(!id)state.clients.push(c)});if(id)$('#remove').onclick=()=>remove('clients',id)}
function editMission(id){const m=state.missions.find(x=>x.id===id)||{id:uid(),name:'',clientId:state.clients[0]?.id||'',offer:state.config.offers[0],year:page==='bilan2026'?2026:2027,date:'',budget:6000,invoiced:0,collected:0,share:state.config.share,daysMartin:null,daysTheo:null,costs:0,status:'Signée',due:'',interest:'À évaluer'};modal(id?'Modifier la mission':'Ajouter une mission confirmée',`<p class="form-help">Uniquement les commandes confirmées. L’année de suivi rattache la mission au bilan annuel. Pour les vues mensuelles et trimestrielles 2027, la date de signature détermine la période. Les factures et encaissements sont des cumuls HT par mission.</p><div class="field-grid">${formField('name','Nom de la mission',m.name)}<div class="field"><label for="f-clientId">Client</label><select name="clientId" id="f-clientId">${state.clients.map(c=>`<option value="${e(c.id)}" ${m.clientId===c.id?'selected':''}>${e(c.name)}</option>`).join('')}</select></div>${formField('offer','Offre principale',m.offer,'select',state.config.offers)}${formField('year','Année de suivi',missionYear(m),'select',[2026,2027])}${formField('date','Date de signature',m.date,'date')}${formField('budget','Commande HT totale studio',m.budget,'number')}${formField('share','Part de Martin (%)',m.share,'number',[],'Le complément est attribué à Théo.')}${formField('invoiced','Facturation cumulée HT',m.invoiced,'number')}${formField('collected','Encaissement cumulé HT',m.collected,'number')}${formField('daysMartin','Jours réels Martin',m.daysMartin,'number')}${formField('daysTheo','Jours réels Théo',m.daysTheo,'number')}${formField('costs','Dépenses externes HT',m.costs,'number')}${formField('due','Prochaine échéance de paiement',m.due,'date')}${formField('status','Production',m.status,'select',['Signée','En cours','Livrée','Terminée'])}${formField('interest','Bilan créatif et humain',m.interest,'select',['À évaluer','Très positif','Positif','Mitigé','Difficile'])}</div>${id?'<button class="danger" type="button" id="remove">Supprimer la mission</button>':''}`,f=>{const b=+f.budget,i=+f.invoiced,c=+f.collected;if(c>i||i>b||+f.share>100||!f.date){toast('Vérifiez les montants (encaissé ≤ facturé ≤ commandé), la part (0–100 %) et la date.');return false}Object.assign(m,f);for(const k of ['budget','invoiced','collected','share','costs','year'])m[k]=Number(f[k]);for(const k of ['daysMartin','daysTheo'])m[k]=f[k]===''?null:+f[k];if(!id)state.missions.push(m)});if(id)$('#remove').onclick=()=>remove('missions',id)}
function editAction(id){const a=state.actions.find(x=>x.id===id)||{id:uid(),title:'',detail:'',owner:'Martin & Théo',date:'',done:false};modal(id?'Modifier l’action':'Nouvelle action commerciale',formField('title','Action',a.title)+formField('detail','Résultat attendu / contexte',a.detail,'textarea')+formField('owner','Responsable',a.owner,'select',['Martin','Théo','Martin & Théo'])+formField('date','Échéance',a.date,'date')+(id?'<button class="danger" type="button" id="remove">Supprimer l’action</button>':''),f=>{Object.assign(a,f);if(!id)state.actions.push(a)});if(id)$('#remove').onclick=()=>remove('actions',id)}
function editExpense(id){const x=state.expenses.find(x=>x.id===id)||{id:uid(),name:'',amount:0,period:'Annuel',active:true};modal(id?'Modifier la charge':'Ajouter une charge',formField('name','Dépense',x.name)+formField('amount','Montant',x.amount,'number')+formField('period','Périodicité',x.period,'select',['À préciser','Mensuel','Annuel'])+formField('active','Incluse au budget',x.active?'Oui':'Non','select',['Oui','Non'])+(id?'<button class="danger" type="button" id="remove">Supprimer la charge</button>':''),f=>{Object.assign(x,f,{amount:+f.amount,active:f.active==='Oui'});if(!id)state.expenses.push(x)});if(id)$('#remove').onclick=()=>remove('expenses',id)}

function missionYear(m){return Number(m.year)||(m.date?new Date(m.date+'T12:00:00').getFullYear():(page==='bilan2026'?2026:2027))}
function annualMetrics(year){const ms=state.missions.filter(m=>missionYear(m)===year);return {ms,count:ms.length,budget:sum(ms,'budget'),invoiced:sum(ms,'invoiced'),collected:sum(ms,'collected'),days:sum(ms,'daysMartin')+sum(ms,'daysTheo'),completeDays:ms.length>0&&ms.every(m=>m.daysMartin!==null&&m.daysTheo!==null),martin:ms.reduce((t,m)=>t+m.budget*m.share/100,0),theo:ms.reduce((t,m)=>t+m.budget*(100-m.share)/100,0),running:ms.filter(m=>['Signée','En cours'].includes(m.status)).length}}
function comparison(){const a=annualMetrics(2026),b=annualMetrics(2027),rows=[['Commandes HT',a.budget,b.budget,'money'],['Nombre de missions',a.count,b.count,'number'],['Panier moyen HT',a.count?a.budget/a.count:0,b.count?b.budget/b.count:0,'money'],['Part Martin HT',a.martin,b.martin,'money'],['Part Théo HT',a.theo,b.theo,'money'],['Facturation cumulée HT',a.invoiced,b.invoiced,'money'],['Encaissements cumulés HT',a.collected,b.collected,'money']];return `<section class="panel"><div class="panel-head"><div><h2>Comparer les deux années</h2><p>Données réelles saisies uniquement · les objectifs 2027 restent séparés</p></div><a href="#pilotage" class="small">Pilotage 2027 ↗</a></div><div class="table-wrap"><table><thead><tr><th>INDICATEUR</th><th>2026 · SAISIE RÉELLE</th><th>2027 · SAISIE RÉELLE</th><th>ÉVOLUTION</th></tr></thead><tbody>${rows.map(([label,v1,v2,kind])=>`<tr><td>${label}</td><td>${a.count?(kind==='money'?money(v1):num(v1)):'—'}</td><td>${b.count?(kind==='money'?money(v2):num(v2)):'—'}</td><td>${a.count&&b.count&&v1?((v2-v1)/v1>=0?'+':'')+num((v2-v1)/v1*100)+' %':'—'}</td></tr>`).join('')}</tbody></table></div><p class="source">Comparaison des années telles que renseignées, sans correction pour les mois écoulés. Une année incomplètement saisie ne constitue pas un bilan définitif. Les facturations et paiements sont rattachés à l’année de suivi des missions, pas à leurs dates bancaires.</p></section>`}
function review2026(){const a=annualMetrics(2026);return intro('L’ANNÉE DE RÉFÉRENCE','2026, <em>pour mieux piloter la suite.</em>','Renseignez les missions réalisées avec Théo et celles encore en cours. Une mission est comptée une seule fois au budget total studio, puis répartie entre vous.')+`<div class="cards">${card('Commandes 2026 HT',a.count?money(a.budget):'—',a.count?a.count+' mission(s) renseignée(s)':'Historique à compléter',true)}${card('Missions en cours / signées',a.count?num(a.running):'—','Statuts Signée ou En cours')}${card('Panier moyen HT',a.count?money(a.budget/a.count):'—','Budget studio / nombre de missions')}${card('Encours HT',a.count?money(a.invoiced-a.collected):'—','Facturé − encaissé sur les missions 2026')}</div><div class="note">Cet onglet est prêt pour une saisie manuelle. Aucun montant n’a été repris automatiquement de vos anciens tableaux. Les réglages et les données déjà saisis dans cette application sont conservés.</div>${missionsBlock(2026)}${comparison()}<section class="panel"><div class="panel-head"><h2>La répartition de votre activité 2026</h2><span class="badge">Selon les missions saisies</span></div><div class="grid equal"><div><h3>Par client</h3>${grouped2026(a.ms,'clientId',key=>state.clients.find(c=>c.id===key)?.name||'Client retiré')}</div><div><h3>Par offre principale</h3>${grouped2026(a.ms,'offer',key=>key)}</div></div></section>`}
function grouped2026(ms,key,label){if(!ms.length)return '<p class="small muted">À compléter avec vos premières missions.</p>';const groups={};for(const m of ms){const v=m[key];groups[v]=(groups[v]||0)+m.budget}return Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${e(label(k))}</span><span>${money(v)}</span></div>`).join('')}

function nav(){const names={pilotage:'Pilotage',bilan2026:'Bilan 2026',portefeuille:'Portefeuille',conquete:'Développement',scenarios:'Modèle économique',reglages:'Réglages'};if(!names[page])page='pilotage';$('#nav').innerHTML=Object.entries(names).map(([id,name],i)=>`<a href="#${id}" class="${page===id?'active':''}"><small>0${i+1}</small>${name}</a>`).join('');$('#breadcrumb').textContent='DIRECTION / '+names[page].toUpperCase();$('.pill').textContent=page==='bilan2026'?'2026':'2027';$('#primary').textContent=page==='portefeuille'?'+ Ajouter une relation':page==='conquete'?'+ Ajouter une action':'+ Ajouter une mission';$('#primary').onclick=()=>page==='portefeuille'?editClient():page==='conquete'?editAction():editMission();}
function render(){nav();$('#app').innerHTML=({pilotage:dashboard,bilan2026:review2026,portefeuille:portfolio,conquete:development,scenarios:scenarios,reglages:settings}[page])();bind();}
function dashboard(){const ms=selectedMissions(),signed=sum(ms,'budget'),invoiced=sum(ms,'invoiced'),collected=sum(ms,'collected'),goal=state.config.target*weight();let select=period==='Année'?'':`<select id="periodIndex" aria-label="Choisir la période" style="width:auto">${(period==='Trimestre'?['T1','T2','T3','T4']:MONTHS).map((v,i)=>`<option value="${i}" ${i===periodIndex?'selected':''}>${v}</option>`).join('')}</select>`;const tabs=`<div class="tabs">${['Année','Trimestre','Mois'].map(v=>`<button data-period="${v}" class="${period===v?'selected':''}">${v}</button>`).join('')}</div>${select}`;
const blocks={trajectory:trajectory(),portfolio:portfolioBlock(),development:developmentBlock(),missions:missionsBlock()};return intro('UN CAP COMMUN','Le studio, <em>en perspective.</em>','Une lecture économique et commerciale de Vision Stéréo. Objectifs, hypothèses et commandes confirmées sont distingués.',tabs)+`<div class="cards">${card('Objectif · '+period.toLowerCase(),money(goal),'Cible annuelle : '+money(state.config.target),true)}${card('Commandes signées',ms.length?money(signed):'—',ms.length?ms.length+' mission(s) confirmée(s)':'Aucune mission renseignée')}${card('Reste à sécuriser',money(Math.max(0,goal-signed)),'Objectif moins commandes signées')}${card('Encours HT des commandes',ms.length?money(invoiced-collected):'—','Cumul facturé − encaissé sur les commandes sélectionnées')}</div><div class="note">${ms.length?'Les filtres portent sur la date de signature des commandes. Les encaissements sont des cumuls HT rattachés à ces commandes, pas les flux bancaires de la période.':'Les clients actifs sont préremplis à partir de nos échanges. Aucun historique financier n’a été importé ; les montants de production ci-dessous sont des hypothèses modifiables.'} <a href="#reglages">Personnaliser les blocs ↗</a></div><div class="note"><a href="#bilan2026">2026 · Renseigner l’année de référence et comparer avec 2027 ↗</a></div>${state.config.blocks.filter(k=>!state.config.hidden.includes(k)).map(k=>blocks[k]||'').join('')}`}
function trajectory(){const c=state.config,w=c.weights,total=w.reduce((a,b)=>a+b,0),max=Math.max(...w);return `<section class="panel"><div class="panel-head"><div><h2>Le rythme de l’année</h2><p>Répartition de l’objectif · ${money(c.target)} · pondérations modifiables</p></div><a class="small" href="#reglages">Ajuster ↗</a></div><div class="bar-chart">${w.map((v,i)=>`<div class="bar-col ${[3,4,5,6,8,9,10].includes(i)?'hot':''}"><div class="bar" style="height:${Math.round(v/max*140)}px"><span>${num(c.target*v/total/1000)} k€</span></div><small>${MONTHS[i]}</small></div>`).join('')}</div><div class="legend"><span><i class="dot hot"></i>Périodes fortes déclarées</span><span><i class="dot"></i>Autres mois</span></div><p class="source">Répartition initiale proposée, pas un historique de saisonnalité mesuré.</p></section>`}
function portfolioBlock(){const active=state.clients.filter(c=>c.status==='Client actif');return `<section class="panel"><div class="panel-head"><div><h2>Votre portefeuille actif</h2><p>${active.length} relations · entretenir la confiance, faire émerger la suite</p></div><a href="#portefeuille" class="small">Tout le portefeuille ↗</a></div><div class="table-wrap"><table><thead><tr><th>STRUCTURE</th><th>COMMANDES ${state.config.year}</th><th>PROCHAINE ACTION</th><th>RESPONSABLE</th><th></th></tr></thead><tbody>${active.map(c=>{const ms=state.missions.filter(m=>m.clientId===c.id&&missionYear(m)===state.config.year);return `<tr><td>${e(c.name)}<small>${e(c.contact||'Interlocuteur à compléter')}</small></td><td>${ms.length?money(sum(ms,'budget')):'Non renseigné'}</td><td>${e(c.next||'À définir')}<small>${c.date?fmtDate(c.date):''}</small></td><td>${e(c.owner)}</td><td><button data-client="${e(c.id)}">Ouvrir</button></td></tr>`}).join('')||'<tr><td colspan="5">Ajoutez vos premiers clients actifs.</td></tr>'}</tbody></table></div></section>`}
function developmentBlock(){const done=state.actions.filter(a=>a.done).length;return `<div class="grid equal"><section class="panel"><div class="panel-head"><h2>Créer le prochain socle</h2><span class="badge warm">À construire</span></div><p>Accompagner une marque dans la durée.</p><p class="small muted">Aucune piste identifiée à ce stade. L’objectif est d’abord de trouver un besoin régulier et le bon interlocuteur.</p><div class="progress"><span style="width:${done/state.actions.length*100||0}%"></span></div><p class="source">${done}/${state.actions.length} actions réalisées · avancement du plan, pas probabilité de vente</p><a href="#conquete" class="small">Voir le plan de développement ↗</a></section><section class="panel"><div class="panel-head"><h2>Le socle du budget</h2><span class="badge">Hypothèse</span></div><div class="row"><div>Projet structurant<p>${state.plan.majorCount} × ${money(state.plan.majorBudget)}</p></div><span class="amount">${money(state.plan.majorCount*state.plan.majorBudget)}</span></div><div class="row"><div>Missions courtes<p>${state.plan.shortCount} × ${money(state.plan.shortBudget)}</p></div><span class="amount">${money(state.plan.shortCount*state.plan.shortBudget)}</span></div><a href="#scenarios" class="small">Modifier la composition du CA ↗</a></section></div>`}
function missionsBlock(yearOverride){const ms=yearOverride?state.missions.filter(m=>missionYear(m)===yearOverride):selectedMissions();return `<section class="panel"><div class="panel-head"><div><h2>${yearOverride?'Missions '+yearOverride:'Commandes & production'}</h2><p>Montants HT studio · parts individuelles renseignées par mission</p></div><button data-newmission>+ Mission</button></div>${ms.length?`<div class="table-wrap"><table><thead><tr><th>MISSION</th><th>COMMANDE</th><th>FACTURÉ</th><th>ENCAISSÉ</th><th>JOURS M / T</th><th></th></tr></thead><tbody>${ms.map(m=>`<tr><td>${e(m.name)}<small>${e(state.clients.find(c=>c.id===m.clientId)?.name||'Client retiré')} · ${e(m.status)}</small></td><td>${money(m.budget)}<small>Martin ${money(m.budget*m.share/100)} / Théo ${money(m.budget*(100-m.share)/100)}</small></td><td>${money(m.invoiced)}</td><td>${money(m.collected)}</td><td>${m.daysMartin??'—'} / ${m.daysTheo??'—'}</td><td><button data-mission="${e(m.id)}">Modifier</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Vos missions confirmées apparaîtront ici.<br>Renseignez vos missions terminées ou en cours pour alimenter les indicateurs réels.</div>'}</section>`}
function portfolio(){let cs=state.clients.filter(c=>(filter==='Tous'||c.status===filter)&&(c.name+' '+(c.contact||'')+' '+(c.notes||'')).toLowerCase().includes(search.toLowerCase()));cs.sort((a,b)=>sort==='Nom'?a.name.localeCompare(b.name):['Prioritaire','À développer','À entretenir','En retrait'].indexOf(a.priority)-['Prioritaire','À développer','À entretenir','En retrait'].indexOf(b.priority));return intro('LE CAPITAL RELATIONNEL','Le portefeuille <em>du studio.</em>','Clients, prescripteurs et partenaires : une vue commune des relations qui font vivre et grandir Vision Stéréo.')+`<div class="cards">${card('Clients actifs',state.clients.filter(c=>c.status==='Client actif').length,'Votre socle actuel',true)}${card('Relations à développer',state.clients.filter(c=>c.status==='Relation à développer').length,'Des échanges, une suite à créer')}${card('Cibles à contacter',state.clients.filter(c=>c.status==='Cible à contacter').length,'De nouvelles portes à ouvrir')}${card('Actions datées',state.clients.filter(c=>c.next&&c.date&&c.status!=='En retrait').length,'Des relations avec une prochaine étape')}</div><div class="toolbar"><input id="search" aria-label="Rechercher une relation" placeholder="Rechercher une structure, une personne…" value="${e(search)}"><select id="filter" aria-label="Filtrer les relations">${['Tous',...STATUSES].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select><select id="sort" aria-label="Trier les relations">${['Priorité','Nom'].map(x=>`<option ${x===sort?'selected':''}>${x}</option>`).join('')}</select></div><div class="client-grid">${cs.map(c=>{const ms=state.missions.filter(m=>m.clientId===c.id&&missionYear(m)===state.config.year);return `<article class="client-card"><div class="client-top"><span class="eyebrow">${e(c.type)} / ${e(c.role)}</span><span class="badge ${c.status==='Client actif'?'active':c.status==='En retrait'?'faint':'warm'}">${e(c.status)}</span></div><h3>${e(c.name)}</h3><p>${e(c.contact||'Interlocuteur à renseigner')}</p><p>${e(c.offer==='À définir'?'Offre à qualifier':c.offer)}</p><div class="row"><span class="small muted">Commandes ${state.config.year}</span><span>${ms.length?money(sum(ms,'budget')):'—'}</span></div><p style="margin-top:14px">${e(c.next||'Prochaine action à définir')} ${c.date?'· '+fmtDate(c.date):''}</p><div class="bottom"><span class="small muted">${e(c.priority)} · ${e(c.owner)}</span><button data-client="${e(c.id)}">Modifier ↗</button></div></article>`}).join('')||'<div class="empty">Aucune relation dans cette sélection.</div>'}</div>`}
function development(){return intro('CRÉER L’OPPORTUNITÉ','Une marque, <em>dans la durée.</em>','Un chantier commercial à construire depuis zéro. Un accompagnement annuel se gagne en démontrant l’utilité d’une collaboration régulière.')+`<div class="note amber"><strong>Statut actuel : aucune piste identifiée.</strong> Aucun revenu de marque récurrent n’est inclus dans le scénario de base. Vous pouvez tester cette hypothèse dans le modèle économique, sans la confondre avec une commande.</div><div class="grid"><section class="panel"><div class="panel-head"><h2>Une démarche en quatre temps</h2><span class="badge">Plan proposé · 90 jours</span></div><div class="step"><span class="step-num">01</span><div><h3>Choisir un besoin récurrent</h3><p>Semaines 1–2 · Sélectionner une offre où vos compétences se renforcent : univers de marque et campagnes, identité et digital, ou activations et contenus.</p><p>Définir les livrables, le rythme, le circuit de validation et la capacité réservée. « Talentueux et réactif » doit se traduire en bénéfice concret pour la marque.</p></div></div><div class="step"><span class="step-num">02</span><div><h3>Sélectionner et trouver l’accès</h3><p>Semaines 2–4 · Constituer une liste de 12 marques, puis travailler les 5 plus pertinentes. Ces volumes sont des objectifs de travail proposés.</p><p>Privilégier une affinité créative, plusieurs temps forts par an, un décideur accessible et un besoin compatible avec votre capacité.</p></div></div><div class="step"><span class="step-num">03</span><div><h3>Écouter avant de proposer</h3><p>Mois 2 · Demander des introductions à votre réseau. Faire préciser le calendrier, les difficultés, les partenaires actuels et la manière d’acheter la création.</p><p>Préparer trois références commentées et une page d’offre adaptée. Respecter les relations et engagements avec les agences partenaires.</p></div></div><div class="step"><span class="step-num">04</span><div><h3>Commencer par un périmètre cadré</h3><p>Mois 3 · Proposer une première mission rémunérée répondant à un besoin identifié, puis organiser son bilan.</p><p>Si la collaboration fonctionne, construire une proposition de plusieurs mois : périmètre, volume, budget, modalités d’arbitrage et disponibilité.</p></div></div></section><section class="panel"><div class="panel-head"><div><h2>Votre plan d’action</h2><p>À adapter, attribuer et dater au fil des échanges.</p></div><button data-newaction>+ Action</button></div><div class="checks">${state.actions.map(a=>`<div class="check-row ${a.done?'done':''}"><input type="checkbox" aria-label="Terminer : ${e(a.title)}" data-actioncheck="${e(a.id)}" ${a.done?'checked':''}><div class="check-label">${e(a.title)}<p>${e(a.detail)}</p><p>${e(a.owner)} · ${fmtDate(a.date)}</p></div><button data-action="${e(a.id)}" aria-label="Modifier ${e(a.title)}">↗</button></div>`).join('')}</div></section></div><div class="note">Mesurer la progression par les introductions obtenues, les échanges qualifiés, les besoins identifiés et les premières missions proposées. La signature d’un contrat annuel reste un résultat à construire.</div>`}
function scenarios(){const p=state.plan,c=state.config,total=scenario(),days=p.shortCount*p.shortDays,unknown=state.expenses.filter(x=>x.active&&x.period==='À préciser');return intro('LE MODÈLE ÉCONOMIQUE','Composer <em>une année viable.</em>','Ajustez les volumes et les budgets. Le scénario est une hypothèse de vente, séparée de vos commandes signées.')+`<div class="cards">${card('Scénario commercial',money(total),'Objectif central : '+money(c.target),true)}${card('Écart à la cible',money(total-c.target),total===c.target?'Cible centrale atteinte':total>c.target?'Au-dessus de la cible centrale':'Sous la cible centrale')}${card('Moyenne par personne / mois',money(total/24),'Hypothèse 50/50 · CA avant dépenses et cotisations')}${card('Charges connues annuelles',money(expenseTotal()),unknown.length?unknown.length+' périodicité(s) à préciser':'Budget des charges activées')}</div><section class="panel"><div class="panel-head"><div><h2>Construire le portefeuille de missions</h2><p>Base initiale : 1 projet structurant + 18 missions courtes = 130 000 €.</p></div><span class="badge">Modifiable</span></div><div class="budget-labels"><span>TYPE DE MISSION</span><span>VOLUME</span><span>BUDGET HT</span><span style="text-align:right">TOTAL</span></div><div class="scenario-line"><label>Missions courtes<small>DA, activation, identité ou projet web</small></label><input aria-label="Nombre de missions courtes" type="number" min="0" step="1" data-plan="shortCount" value="${p.shortCount}"><input aria-label="Budget par mission courte" type="number" min="0" step="100" data-plan="shortBudget" value="${p.shortBudget}"><output>${money(p.shortCount*p.shortBudget)}</output></div><div class="scenario-line"><label>Projet structurant<small>Référence économique : Velvet</small></label><input aria-label="Nombre de projets structurants" type="number" min="0" step="1" data-plan="majorCount" value="${p.majorCount}"><input aria-label="Budget d’un projet structurant" type="number" min="0" step="100" data-plan="majorBudget" value="${p.majorBudget}"><output>${money(p.majorCount*p.majorBudget)}</output></div><div class="scenario-line"><label><span class="inline-check"><input type="checkbox" id="annualEnabled" ${p.annualEnabled?'checked':''}>Tester un accompagnement de marque</span><small>Hypothèse exploratoire · aucune piste à ce stade</small></label><input aria-label="Nombre de mois d’accompagnement" type="number" min="0" max="12" data-plan="annualMonths" value="${p.annualMonths}"><input aria-label="Budget mensuel d’accompagnement" type="number" min="0" step="100" data-plan="annualMonthly" value="${p.annualMonthly}"><output>${money(p.annualEnabled?p.annualMonthly*p.annualMonths:0)}</output></div><div class="total-line"><span>Hypothèse annuelle studio</span><strong>${money(total)}</strong></div></section><div class="grid equal"><section class="panel"><div class="panel-head"><h2>Capacité de production</h2><span class="badge warm">À qualifier</span></div><div class="field-grid"><div class="field"><label for="shortDays">Jours par mission courte</label><input id="shortDays" type="number" min="0" step="0.5" value="${p.shortDays}"></div><div class="field"><label for="daysMode">Ces jours correspondent à…</label><select id="daysMode">${['À préciser','Total cumulé des deux','Chacun des deux'].map(v=>`<option ${c.daysMode===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="row"><span>Charge des missions courtes</span><span class="amount">${num(days*(c.daysMode==='Chacun des deux'?2:1))} j${c.daysMode==='À préciser'?' *':'-personnes'}</span></div><p class="source">${c.daysMode==='À préciser'?'* Unité à confirmer avant de conclure sur la capacité.':'Le temps d’un projet est la somme du travail de Martin et Théo.'} Le projet structurant, le commercial, l’administration et l’accompagnement éventuel restent à ajouter.</p><p class="small muted">Cadre de travail : ${c.hours} h/semaine/personne · ${c.weeks} semaines/an (hypothèse modifiable). Aucune conclusion de disponibilité n’est calculée sans ces temps complémentaires.</p></section><section class="panel"><div class="panel-head"><h2>Repères à garder en tête</h2></div><div class="row"><div>6 000 € de CA mensuel chacun<p>Avant dépenses et cotisations</p></div><span class="amount">144 000 €/an</span></div><p class="small muted" style="margin-top:18px">Le CA n’est pas une rémunération disponible. Cette V1 ne calcule pas les cotisations, l’impôt ou la TVA.</p><p class="small muted">La trésorerie renseignée reste distincte des réserves personnelles.</p><a href="#reglages" class="small">Renseigner la trésorerie et les charges ↗</a></section></div>`}
function settings(){const c=state.config,labels={trajectory:'Saisonnalité et objectif mensuel',portfolio:'Portefeuille clients actif',development:'Développement et composition du CA',missions:'Commandes et production'};return intro('VOTRE OUTIL, VOS RÈGLES','Un poste <em>modulable.</em>','Modifiez les objectifs, les offres, les charges et la composition du tableau. Les modifications sont conservées dans ce navigateur.')+`<section class="panel"><div class="panel-head"><h2>Objectifs et cadre de travail</h2><button id="saveConfig" class="dark">Enregistrer les réglages</button></div><div class="field-grid">${formField('low','Objectif de base HT',c.low,'number')}${formField('target','Cible centrale HT',c.target,'number')}${formField('high','Ambition haute HT',c.high,'number')}${formField('hours','Heures / semaine / personne',c.hours,'number')}${formField('weeks','Semaines travaillées / an',c.weeks,'number',[],'46 semaines = hypothèse initiale à adapter.')}${formField('share','Part Martin par défaut (%)',c.share,'number',[],'Utilisée uniquement pour les nouvelles missions.')}${formField('cashMartin','Trésorerie affectée à l’activité — Martin',c.cashMartin,'number',[],'Solde saisi manuellement, hors réserve personnelle.')}${formField('cashTheo','Trésorerie affectée à l’activité — Théo',c.cashTheo,'number')}${formField('reserveGoal','Objectif de réserve professionnelle à deux',c.reserveGoal,'number',[],'À définir ; aucun seuil n’est imposé.')}</div><p class="small muted">Trésorerie renseignée : ${c.cashMartin===null&&c.cashTheo===null?'aucun solde saisi':money((c.cashMartin||0)+(c.cashTheo||0))+(c.cashMartin===null||c.cashTheo===null?' · donnée partielle':'')}.</p></section><div class="grid equal"><section class="panel"><div class="panel-head"><h2>Composer votre accueil</h2></div>${c.blocks.map((id,i)=>`<div class="settings-row"><label class="inline-check"><input type="checkbox" data-block="${id}" ${!c.hidden.includes(id)?'checked':''}>${labels[id]||e(id)}</label><button data-move="${id}" data-dir="-1" ${i===0?'disabled':''} aria-label="Monter ${labels[id]}">↑</button><button data-move="${id}" data-dir="1" ${i===c.blocks.length-1?'disabled':''} aria-label="Descendre ${labels[id]}">↓</button></div>`).join('')}</section><section class="panel"><div class="panel-head"><h2>Vos offres</h2><button id="addOffer">+ Offre</button></div>${c.offers.map((x,i)=>`<div class="row"><span>${e(x)}</span><button data-offer="${i}">Renommer</button></div>`).join('')}<p class="source">Les anciennes missions conservent leur offre d’origine si vous renommez une catégorie.</p></section></div><section class="panel"><div class="panel-head"><div><h2>Répartir l’objectif dans l’année</h2><p>Pondérations relatives : l’outil les normalise automatiquement sur 100 %.</p></div><button id="saveWeights">Enregistrer la répartition</button></div><div class="month-inputs">${c.weights.map((v,i)=>`<label>${MONTHS[i]}<input aria-label="Pondération ${MONTHS[i]}" data-weight="${i}" type="number" min="0" step="1" value="${v}"></label>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Charges professionnelles</h2><p>Les montants à périodicité inconnue sont exclus du total tant qu’ils ne sont pas précisés.</p></div><button id="addExpense">+ Charge</button></div><div class="table-wrap"><table><thead><tr><th>DÉPENSE</th><th>MONTANT</th><th>PÉRIODICITÉ</th><th>BUDGET</th><th></th></tr></thead><tbody>${state.expenses.map(x=>`<tr><td>${e(x.name)}</td><td>${money(x.amount)}</td><td>${e(x.period)}</td><td><span class="badge ${x.active?'active':'faint'}">${x.active?'Incluse':'Désactivée'}</span></td><td><button data-expense="${e(x.id)}">Modifier</button></td></tr>`).join('')}</tbody></table></div><div class="total-line"><span>Total annuel des charges connues</span><strong>${money(expenseTotal())}</strong></div></section><section class="panel"><div class="panel-head"><h2>Conserver et transférer vos données</h2></div><p class="small muted">Cette première version enregistre les données sur cet appareil. Elle ne synchronise pas les modifications entre Martin, Théo et les autres navigateurs. Un export contient les réglages, relations, missions et actions ; l’import remplace les données de cet appareil.</p><div class="toolbar"><button id="export2" class="dark">Exporter JSON</button><button id="import2">Importer JSON</button></div></section>`}
function bind(){document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>editClient(b.dataset.client));document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>editMission(b.dataset.mission));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>editAction(b.dataset.action));document.querySelectorAll('[data-expense]').forEach(b=>b.onclick=()=>editExpense(b.dataset.expense));document.querySelectorAll('[data-newmission]').forEach(b=>b.onclick=()=>editMission());document.querySelectorAll('[data-newaction]').forEach(b=>b.onclick=()=>editAction());document.querySelectorAll('[data-actioncheck]').forEach(b=>b.onchange=()=>{state.actions.find(x=>x.id===b.dataset.actioncheck).done=b.checked;save();render()});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;periodIndex=0;render()});if($('#periodIndex'))$('#periodIndex').onchange=ev=>{periodIndex=+ev.target.value;render()};if($('#search'))$('#search').oninput=ev=>{const pos=ev.target.selectionStart;search=ev.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};for(const id of ['filter','sort'])if($('#'+id))$('#'+id).onchange=ev=>{if(id==='filter')filter=ev.target.value;else sort=ev.target.value;render()};document.querySelectorAll('[data-plan]').forEach(b=>b.onchange=()=>{const v=+b.value,k=b.dataset.plan;if(!Number.isFinite(v)||v<0||(['shortCount','majorCount','annualMonths'].includes(k)&&!Number.isInteger(v))||(k==='annualMonths'&&v>12)){toast('Saisissez une valeur valide et un nombre entier pour les volumes.');render();return}state.plan[k]=v;save();render()});if($('#annualEnabled'))$('#annualEnabled').onchange=ev=>{state.plan.annualEnabled=ev.target.checked;save();render()};if($('#shortDays'))$('#shortDays').onchange=ev=>{if(+ev.target.value>=0)state.plan.shortDays=+ev.target.value;save();render()};if($('#daysMode'))$('#daysMode').onchange=ev=>{state.config.daysMode=ev.target.value;save();render()};document.querySelectorAll('[data-block]').forEach(b=>b.onchange=()=>{state.config.hidden=state.config.hidden.filter(x=>x!==b.dataset.block);if(!b.checked)state.config.hidden.push(b.dataset.block);save()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const a=state.config.blocks,i=a.indexOf(b.dataset.move),j=i+ +b.dataset.dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()});if($('#saveConfig'))$('#saveConfig').onclick=()=>{const fields=['low','target','high','hours','weeks','share','cashMartin','cashTheo','reserveGoal'],v={};for(const k of fields){const raw=$('#f-'+k).value;v[k]=raw===''&&['cashMartin','cashTheo','reserveGoal'].includes(k)?null:Number(raw)}if(Object.values(v).some(x=>x!==null&&(!Number.isFinite(x)||x<0))||v.low>v.target||v.target>v.high||v.share>100||v.hours>168||v.weeks>52){toast('Vérifiez : base ≤ cible ≤ ambition, part ≤ 100 %, semaines ≤ 52.');return}Object.assign(state.config,v);if(save())toast('Réglages enregistrés.');render()};if($('#saveWeights'))$('#saveWeights').onclick=()=>{const ws=[...document.querySelectorAll('[data-weight]')].map(x=>+x.value);if(ws.some(x=>!Number.isFinite(x)||x<0)||sum(ws.map(x=>({v:x})),'v')<=0){toast('Saisissez des poids positifs, dont au moins un supérieur à zéro.');return}state.config.weights=ws;if(save())toast('Répartition enregistrée.');render()};if($('#addExpense'))$('#addExpense').onclick=()=>editExpense();if($('#addOffer'))$('#addOffer').onclick=()=>modal('Ajouter une offre',formField('name','Nom de l’offre',''),f=>{if(!f.name.trim())return false;state.config.offers.push(f.name.trim())});document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{const i=+b.dataset.offer;modal('Renommer l’offre',formField('name','Nom de l’offre',state.config.offers[i]),f=>{if(!f.name.trim())return false;state.config.offers[i]=f.name.trim()})});if($('#export2'))$('#export2').onclick=exportData;if($('#import2'))$('#import2').onclick=()=>$('#import').click();}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vision-stereo-direction-2027-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Export préparé : conservez ce fichier pour transférer vos données.')}
$('#export').onclick=exportData;$('#import').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const x=JSON.parse(await file.text());if(!valid(x))throw Error();if(confirm(`Remplacer les données de cet appareil par ${x.clients.length} relations et ${x.missions.length} missions ? Exportez d’abord si nécessaire.`)){state=x;save();render();toast('Données importées.')}}catch{toast('Import refusé : choisissez un export JSON valide de cette application.')}finally{ev.target.value=''}};
